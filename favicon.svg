<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="50%" stop-color="#0f0e0d" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffa066" />
      <stop offset="50%" stop-color="#ff6b35" />
      <stop offset="100%" stop-color="#e8590c" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b35" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base with Soft Bevel Border -->
  <rect x="5" y="5" width="118" height="118" rx="30" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="4" />

  <!-- Ambient Amber Glow Spot -->
  <circle cx="64" cy="64" r="36" fill="#ff6b35" opacity="0.18" filter="url(#glow)" />

  <!-- Geometric DP Monogram -->
  <g font-family="'Space Grotesk', 'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="900" font-size="56" letter-spacing="-3">
    <!-- Drop Shadow / Depth -->
    <text x="66" y="84" text-anchor="middle" fill="#000000" opacity="0.6">DP</text>
    <!-- Main Glowing Text -->
    <text x="64" y="82" text-anchor="middle" fill="url(#primaryGrad)">DP</text>
  </g>
  
  <!-- Modern Tech Pulse Accent -->
  <circle cx="98" cy="34" r="4.5" fill="#38bdf8" />
  <circle cx="98" cy="34" r="7" fill="#38bdf8" opacity="0.35" />
</svg>
